[package]
name = "qca-sim"
version = "0.1.0"
edition = "2021"
description = "Adversarial mempool simulator for the QCA authorization game (docs/GAME.md)"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qca-sim"
path = "src/main.rs"

[package]
name = "qca-cli"
version = "0.1.0"
edition = "2021"
description = "Wallet CLI for the commit-reveal PQ authorization protocol: seed generation, roots, proofs, commitments, golden test vectors."
license = "MIT"

[dependencies]
qca-core = { path = "../qca-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"

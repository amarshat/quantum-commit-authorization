[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned for reproducibility; gas numbers in docs and the paper must be
# reproducible from a clean clone with `forge test` alone.
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true

# Golden vectors generated by the Rust tooling; see test/GoldenVectors.t.sol.
fs_permissions = [{ access = "read", path = "./test/vectors" }]
